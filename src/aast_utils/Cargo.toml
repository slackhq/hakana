[package]
name = "hakana-aast-helper"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
hakana-code-info = { path = "../code_info" }
hakana-parser = { path = "../parser" }
bumpalo = { version = "3.11" }
hakana-str = { path = "../str" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
xxhash-rust = { version = "0.8.3", features = ["xxh3", "xxh32"] }
rustc-hash = "1.1.0"
