[package]
name = "hakana-format"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[[bin]]
name = "hakana-format"
path = "main.rs"

[dependencies]
hakana-parser = { path = "../parser" }
regex = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hakana-file-discovery = { path = "../file_discovery" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = "1"

[dev-dependencies]
tempfile = "3"
